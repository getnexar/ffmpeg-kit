apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arthenica.ffmpegkit'
    }
    compileSdk 35
    ndkVersion "27.3.13750724"

    defaultConfig {
        minSdk 29
        targetSdk 35
        versionCode 350600
        versionName "6.0"
        project.archivesBaseName = "ffmpeg-kit"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["../libs"]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'enable.ffmpeg.kit.test.mode', 'true'
        }
    }

    publishing {
        singleVariant('release') {
            withJavadocJar()
            withSourcesJar()
        }
    }

    packagingOptions {
        // Exclude non-NEON .so files from armeabi-v7a to reduce size
        // This keeps only the *_neon.so files which are optimized for most modern devices
        exclude '/lib/armeabi-v7a/libavcodec.so'
        exclude '/lib/armeabi-v7a/libavdevice.so'
        exclude '/lib/armeabi-v7a/libavfilter.so'
        exclude '/lib/armeabi-v7a/libavformat.so'
        exclude '/lib/armeabi-v7a/libavutil.so'
        exclude '/lib/armeabi-v7a/libffmpegkit.so'
        exclude '/lib/armeabi-v7a/libswresample.so'
        exclude '/lib/armeabi-v7a/libswscale.so'
    }
}

task javadoc(type: Javadoc) {
    title = 'FFmpegKit'
    destinationDir = file("${projectDir}/../../docs/android/javadoc")
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    source = android.sourceSets.main.java.srcDirs
    configurations.implementation.setCanBeResolved(true)
    classpath += configurations.implementation
}

dependencies {
    api 'com.arthenica:smart-exception-java:0.2.1'
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation 'org.json:json:20230618'
}
